<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inspect Asteroids</title>
<style>
  body{margin:0;background:#000;color:#ddd;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:flex-start;justify-content:center;padding:20px;box-sizing:border-box;}
  #gameWrap{border:6px solid #444;padding:10px;background:radial-gradient(#050505,#000);}
  canvas{background:#000;display:block;}
  #ui{color:#ddd;margin-left:16px;width:240px;}
  h1{margin:0 0 6px;font-size:18px;text-align:center;}
  #info{font-size:13px;margin-top:6px;}
  button{width:100%;padding:8px;margin-top:8px;border:3px solid #333;background:#111;color:#fff;cursor:pointer;font-family:inherit;}
  .small{font-size:13px;color:#bbb;margin-top:6px;}
  #menuPanel{border:2px solid #444;padding:12px;margin-bottom:10px;background:#111;}
  #menuPanel label{display:block;margin:6px 0;cursor:pointer;}
  #gameRow{display:flex;flex-wrap:wrap;align-items:flex-start;}
  a{color:#9cf;}
</style>
</head>
<body id="asteroidsStandalone">
<script>
(function(){
  var standalone=document.body.id==="asteroidsStandalone";

  function runAsteroids(){
    if(window.__asteroidsOn)return;
    if(window.__asteroidsOff)window.__asteroidsOff();
    window.__asteroidsOn=true;

    var root=document.createElement("div");
    root.id="__astRoot";
    root.style.cssText=standalone
      ?"min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;box-sizing:border-box;background:#000;color:#ddd;font-family:Arial,Helvetica,sans-serif;"
      :"position:fixed;inset:0;z-index:2147483640;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:auto;padding:20px;box-sizing:border-box;background:#000;color:#ddd;font-family:Arial,Helvetica,sans-serif;";

    root.innerHTML=
      '<div id="menuPanel" style="max-width:520px;width:100%;">'+
      '<h1 style="margin:0 0 10px;font-size:20px;text-align:center;">Inspect Asteroids</h1>'+
      '<p style="margin:0 0 8px;font-size:14px;"><strong>Players</strong></p>'+
      '<label><input type="radio" name="astMode" value="1" checked> 1 Player</label>'+
      '<label><input type="radio" name="astMode" value="2"> 2 Player Co-op</label>'+
      '<label><input type="radio" name="astMode" value="3"> 2 Player Versus</label>'+
      '<button type="button" id="astStartBtn">Start game</button>'+
      (standalone?'<p class="small" style="margin-top:10px;"><a href="index.html">Terrible settings</a></p>':'')+
      '</div>'+
      '<div id="gameRow" style="display:none;">'+
      '<div id="gameWrap" style="border:6px solid #444;padding:10px;background:radial-gradient(#050505,#000);">'+
      '<canvas id="canvas" width="760" height="560"></canvas></div>'+
      '<div id="ui"><h1>Asteroids</h1>'+
      '<div id="score">Score: 0</div><div id="lives">Lives: 3</div><div id="level">Level: 1</div>'+
      '<div id="message" class="small"></div>'+
      '<button type="button" id="restartBtn">Start / Restart</button>'+
      '<div id="info" class="small"></div></div></div>';

    if(standalone)document.body.innerHTML="";
    (standalone?document.body:document.documentElement).appendChild(root);

    var menuPanel=document.getElementById("menuPanel");
    var gameRow=document.getElementById("gameRow");
    var canvas=document.getElementById("canvas");
    var ctx=canvas.getContext("2d");
    var W=canvas.width,H=canvas.height;
    var scoreEl=document.getElementById("score");
    var livesEl=document.getElementById("lives");
    var levelEl=document.getElementById("level");
    var messageEl=document.getElementById("message");
    var infoEl=document.getElementById("info");
    var astStartBtn=document.getElementById("astStartBtn");
    var restartBtn=document.getElementById("restartBtn");

    var SHIP_SIZE=20,TURN_SPEED=360,THRUST=0.15,FRICTION=0.99;
    var BULLET_SPEED=6,BULLET_LIFE=60,ASTEROID_SPEED=1.2;
    var ASTEROID_VERT=10,ASTEROID_JAG=0.4,PARTICLE_LIFE=30;
    var MAX_SPLITS=4,MIN_AST_R=12,SPLIT_COUNT=3;
    var UFO_SPAWN_BASE=900;

    var ships,bullets,asteroids,particles,ufos,ufoBullets;
    var keys={},score=0,lives=3,level=1,running=false,lastTime=0;
    var scores=[0,0],playerLives=[3,3];
    var shootCooldown=[0,0],gameMode=1,ufoSpawnTimer=0,playing=false;

    function rand(a,b){return Math.random()*(b-a)+a;}
    function degToRad(d){return d*Math.PI/180;}
    function wrapPos(p,max){if(p<0)return p+max;if(p>=max)return p-max;return p;}
    function getMode(){var r=document.querySelector('input[name="astMode"]:checked');return r?parseInt(r.value,10):1;}

    function createShip(x,y,color){
      return{x:x||W/2,y:y||H/2,r:SHIP_SIZE/2,angle:-90,thrusting:false,vx:0,vy:0,
        invulnerable:0,blink:0,color:color||"#fff",alive:true};
    }

    function createAsteroid(x,y,r,gen){
      var vert=Math.floor(rand(ASTEROID_VERT-2,ASTEROID_VERT+2)),points=[],i,angle,rad,speed,ang;
      gen=gen||0;
      for(i=0;i<vert;i++){
        angle=(Math.PI*2/vert)*i;
        rad=r*(1+rand(-ASTEROID_JAG,ASTEROID_JAG));
        points.push({x:Math.cos(angle)*rad,y:Math.sin(angle)*rad});
      }
      speed=rand(0.3,ASTEROID_SPEED+level*0.2);
      ang=rand(0,Math.PI*2);
      return{x:x,y:y,r:r,points:points,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed,
        rot:rand(-0.02,0.02),gen:gen};
    }

    function spawnAsteroidAtEdge(){
      var x,y,r=rand(40,70);
      if(Math.random()<0.5){
        x=Math.random()<0.5?rand(0,50):rand(W-50,W);
        y=rand(0,H);
      }else{
        x=rand(0,W);
        y=Math.random()<0.5?rand(0,50):rand(H-50,H);
      }
      asteroids.push(createAsteroid(x,y,r,0));
    }

    function spawnAsteroids(n){
      var i;
      for(i=0;i<n;i++)spawnAsteroidAtEdge();
    }

    function createUFO(large){
      var x,y,vx,vy,sp=large?0.8:1.6;
      if(Math.random()<0.5){x=large?-30:W+30;vx=sp;}else{x=large?W+30:-30;vx=-sp;}
      y=rand(40,H-40);
      vy=large?rand(-0.4,0.4):rand(-1.2,1.2);
      return{x:x,y:y,vx:vx,vy:vy,r:large?28:16,large:large,shootCd:large?90:45,dir:vx>0?1:-1};
    }

    function maybeSpawnUFO(){
      if(!playing||ufos.length>=2)return;
      ufoSpawnTimer--;
      if(ufoSpawnTimer>0)return;
      ufoSpawnTimer=UFO_SPAWN_BASE+rand(-200,200)-level*40;
      ufos.push(createUFO(Math.random()<0.35));
    }

    function setControlsHint(){
      if(gameMode===3){
        infoEl.innerHTML="Versus — P1: A/D rotate, W thrust, S shoot · P2: ←/→ rotate, ↑ thrust, ↓ shoot<br>Space: both shoot · Highest score wins · P pause";
      }else if(gameMode===2){
        infoEl.innerHTML="Co-op — P1: A/D rotate, W thrust, S shoot · P2: ←/→ rotate, ↑ thrust, ↓ shoot<br>Space: both shoot · P pause · R respawn";
      }else{
        infoEl.innerHTML="← / → rotate · ↑ thrust · Space shoot<br>P pause · R respawn";
      }
    }

    function startGame(){
      gameMode=getMode();
      ships=gameMode>=2
        ?[createShip(W*0.25,H/2,"#fff"),createShip(W*0.75,H/2,"#6cf")]
        :[createShip()];
      bullets=[];asteroids=[];particles=[];ufos=[];ufoBullets=[];
      score=0;scores=[0,0];playerLives=[3,3];
      lives=gameMode===2?6:3;level=1;
      spawnAsteroids(4+level);
      running=true;playing=true;lastTime=0;
      shootCooldown=[0,0];ufoSpawnTimer=Math.floor(UFO_SPAWN_BASE*0.5);
      messageEl.textContent="";
      menuPanel.style.display="none";
      gameRow.style.display="flex";
      setControlsHint();
      updateUI();
    }

    function showMenu(){
      playing=false;running=false;
      menuPanel.style.display="block";
      gameRow.style.display="none";
    }

    function nextLevel(){
      level++;
      spawnAsteroids(3+level);
      ufoSpawnTimer=Math.min(ufoSpawnTimer,120);
      updateUI();
    }

    function updateUI(){
      if(gameMode===3){
        scoreEl.textContent="P1: "+scores[0]+"  |  P2: "+scores[1];
        livesEl.textContent="P1 lives: "+playerLives[0]+"  |  P2 lives: "+playerLives[1];
      }else{
        scoreEl.textContent="Score: "+score;
        livesEl.textContent=(gameMode===2?"Combined lives":"Lives")+": "+lives;
      }
      levelEl.textContent="Level: "+level;
    }

    function togglePause(){
      if(!playing)return;
      running=!running;
      messageEl.textContent=running?"":"PAUSED";
    }

    function respawn(){
      var i;
      if(!running||!playing)return;
      for(i=0;i<ships.length;i++){
        if(ships[i].alive&&ships[i].invulnerable<=0){
          ships[i]=createShip(ships[i].x,ships[i].y,ships[i].color);
          ships[i].invulnerable=120;
          ships[i].blink=12;
        }
      }
    }

    function shootFrom(ship,idx){
      if(shootCooldown[idx]>0||!ship.alive)return;
      var a=degToRad(ship.angle),bx=ship.x+Math.cos(a)*ship.r,by=ship.y+Math.sin(a)*ship.r;
      bullets.push({x:bx,y:by,vx:ship.vx+Math.cos(a)*BULLET_SPEED,vy:ship.vy+Math.sin(a)*BULLET_SPEED,
        life:BULLET_LIFE,owner:idx});
      shootCooldown[idx]=10;
    }

    function ufoShoot(u){
      var tgt=ships[0],dx,dy,d,ang,sp=3.5,i,best=1e9;
      for(i=0;i<ships.length;i++){
        if(!ships[i].alive)continue;
        d=Math.hypot(ships[i].x-u.x,ships[i].y-u.y);
        if(d<best){best=d;tgt=ships[i];}
      }
      dx=tgt.x-u.x;dy=tgt.y-u.y;
      d=Math.hypot(dx,dy)||1;
      ang=Math.atan2(dy,dx);
      ufoBullets.push({x:u.x,y:u.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:90});
    }

    function spawnParticles(x,y,color,n){
      var i,ang,sp;
      n=n||12;
      for(i=0;i<n;i++){
        ang=rand(0,Math.PI*2);sp=rand(1,4);
        particles.push({x:x,y:y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:PARTICLE_LIFE,color:color});
      }
    }

    function pointInPoly(px,py,poly,ox,oy){
      var inside=false,i,j,xi,yi,xj,yj,intersect;
      for(i=0,j=poly.length-1;i<poly.length;j=i++){
        xi=poly[i].x+ox;yi=poly[i].y+oy;
        xj=poly[j].x+ox;yj=poly[j].y+oy;
        intersect=((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi);
        if(intersect)inside=!inside;
      }
      return inside;
    }

    function asteroidHitsShip(ast,s){
      var dx=ast.x-s.x,dy=ast.y-s.y,dist=Math.hypot(dx,dy),p,vx,vy;
      if(dist>ast.r+s.r)return false;
      if(pointInPoly(s.x,s.y,ast.points,ast.x,ast.y))return true;
      for(p=0;p<ast.points.length;p++){
        vx=ast.x+ast.points[p].x;vy=ast.y+ast.points[p].y;
        if(Math.hypot(vx-s.x,vy-s.y)<s.r)return true;
      }
      return false;
    }

    function killShip(si){
      var s=ships[si];
      if(!s.alive||s.invulnerable>0)return;
      spawnParticles(s.x,s.y,s.color,24);
      if(gameMode===3){
        playerLives[si]--;
        updateUI();
        if(playerLives[si]<=0){
          s.alive=false;
          if(!ships[0].alive&&!ships[1].alive)gameOver();
          return;
        }
        ships[si]=createShip(s.x,s.y,s.color);
        ships[si].invulnerable=120;
        ships[si].blink=12;
        return;
      }
      s.alive=false;
      lives--;
      updateUI();
      if(lives<=0){gameOver();return;}
      ships[si]=createShip(s.x,s.y,s.color);
      ships[si].invulnerable=120;
      ships[si].blink=12;
    }

    function splitAsteroid(idx,owner){
      var a=asteroids[idx],newR,i,ang,spd;
      spawnParticles(a.x,a.y,"#888",10);
      newR=a.r*0.55;
      if(a.gen<MAX_SPLITS&&newR>=MIN_AST_R){
        for(i=0;i<SPLIT_COUNT;i++){
          ang=rand(0,Math.PI*2);
          spd=rand(0.4,1.2);
          asteroids.push(createAsteroid(a.x+Math.cos(ang)*8,a.y+Math.sin(ang)*8,newR,a.gen+1));
          asteroids[asteroids.length-1].vx=Math.cos(ang)*spd;
          asteroids[asteroids.length-1].vy=Math.sin(ang)*spd;
        }
      }else{
        spawnAsteroidAtEdge();
      }
      asteroids.splice(idx,1);
    }

    function addScore(owner,pts){
      if(gameMode===3){
        scores[owner]+=pts;
      }else{
        score+=pts;
      }
    }

    function gameOver(){
      running=false;playing=false;
      if(gameMode===3){
        if(scores[0]>scores[1])messageEl.textContent="PLAYER 1 WINS! "+scores[0]+" vs "+scores[1];
        else if(scores[1]>scores[0])messageEl.textContent="PLAYER 2 WINS! "+scores[1]+" vs "+scores[0];
        else messageEl.textContent="TIE GAME! "+scores[0]+" each";
      }else{
        messageEl.textContent="GAME OVER — Start / Restart or menu";
      }
    }

    function updateShip(ship,si,dt){
      if(!ship.alive)return;
      if(gameMode===1){
        if(keys.arrowleft)ship.angle-=TURN_SPEED*dt;
        if(keys.arrowright)ship.angle+=TURN_SPEED*dt;
        if(keys.arrowup){
          var a1=degToRad(ship.angle);
          ship.vx+=Math.cos(a1)*THRUST;ship.vy+=Math.sin(a1)*THRUST;ship.thrusting=true;
        }else ship.thrusting=false;
      }else{
        if(si===0){
          if(keys.a)ship.angle-=TURN_SPEED*dt;
          if(keys.d)ship.angle+=TURN_SPEED*dt;
          if(keys.w){
            var a2=degToRad(ship.angle);
            ship.vx+=Math.cos(a2)*THRUST;ship.vy+=Math.sin(a2)*THRUST;ship.thrusting=true;
          }else ship.thrusting=false;
        }else{
          if(keys.arrowleft)ship.angle-=TURN_SPEED*dt;
          if(keys.arrowright)ship.angle+=TURN_SPEED*dt;
          if(keys.arrowup){
            var a3=degToRad(ship.angle);
            ship.vx+=Math.cos(a3)*THRUST;ship.vy+=Math.sin(a3)*THRUST;ship.thrusting=true;
          }else ship.thrusting=false;
        }
      }
      ship.x+=ship.vx;ship.y+=ship.vy;
      ship.vx*=FRICTION;ship.vy*=FRICTION;
      ship.x=wrapPos(ship.x,W);ship.y=wrapPos(ship.y,H);
      if(ship.invulnerable>0){
        ship.invulnerable--;
        ship.blink=Math.floor(ship.invulnerable/10)%2;
      }
    }

    function update(dt){
      var si,ship,i,j,b,a,u,ub,dx,dy,hit;
      if(!running||!playing)return;

      for(si=0;si<ships.length;si++)updateShip(ships[si],si,dt);

      if(keys.space||keys[" "]){
        for(si=0;si<ships.length;si++)shootFrom(ships[si],si);
      }
      if(gameMode>=2){
        if(keys.s)shootFrom(ships[0],0);
        if(keys.arrowdown)shootFrom(ships[1],1);
      }
      for(si=0;si<shootCooldown.length;si++)if(shootCooldown[si]>0)shootCooldown[si]--;

      for(i=bullets.length-1;i>=0;i--){
        b=bullets[i];b.x+=b.vx;b.y+=b.vy;b.life--;
        b.x=wrapPos(b.x,W);b.y=wrapPos(b.y,H);
        if(b.life<=0)bullets.splice(i,1);
      }

      maybeSpawnUFO();

      for(i=ufos.length-1;i>=0;i--){
        u=ufos[i];
        u.x+=u.vx;u.y+=u.vy;
        if(u.x<-60||u.x>W+60){ufos.splice(i,1);continue;}
        u.y=Math.max(20,Math.min(H-20,u.y));
        u.shootCd--;
        if(u.shootCd<=0){ufoShoot(u);u.shootCd=u.large?90+rand(0,60):40+rand(0,30);}
        for(j=bullets.length-1;j>=0;j--){
          b=bullets[j];
          if(Math.hypot(u.x-b.x,u.y-b.y)<u.r){
            bullets.splice(j,1);
            spawnParticles(u.x,u.y,"#f66",14);
            addScore(b.owner,u.large?200:1000);
            updateUI();
            ufos.splice(i,1);
            break;
          }
        }
      }

      for(i=ufoBullets.length-1;i>=0;i--){
        ub=ufoBullets[i];
        ub.x+=ub.vx;ub.y+=ub.vy;ub.life--;
        ub.x=wrapPos(ub.x,W);ub.y=wrapPos(ub.y,H);
        if(ub.life<=0){ufoBullets.splice(i,1);continue;}
        for(si=0;si<ships.length;si++){
          ship=ships[si];
          if(ship.alive&&ship.invulnerable<=0&&Math.hypot(ub.x-ship.x,ub.y-ship.y)<ship.r){
            killShip(si);
            ufoBullets.splice(i,1);
            break;
          }
        }
      }

      for(i=asteroids.length-1;i>=0;i--){
        a=asteroids[i];
        a.x+=a.vx;a.y+=a.vy;
        a.x=wrapPos(a.x,W);a.y=wrapPos(a.y,H);

        for(j=bullets.length-1;j>=0;j--){
          b=bullets[j];
          if(Math.hypot(a.x-b.x,a.y-b.y)<a.r){
            bullets.splice(j,1);
            splitAsteroid(i,b.owner);
            addScore(b.owner,Math.round(50/(a.gen+1)+a.r*0.5));
            updateUI();
            break;
          }
        }
        if(i>=asteroids.length)continue;
        a=asteroids[i];
        for(si=0;si<ships.length;si++){
          ship=ships[si];
          if(ship.alive&&ship.invulnerable<=0&&asteroidHitsShip(a,ship)){
            killShip(si);
            break;
          }
        }
      }

      for(i=particles.length-1;i>=0;i--){
        particles[i].x+=particles[i].vx;particles[i].y+=particles[i].vy;
        particles[i].vx*=0.98;particles[i].vy*=0.98;particles[i].life--;
        if(particles[i].life<=0)particles.splice(i,1);
      }

      if(asteroids.length===0)nextLevel();
    }

    function drawShip(s){
      if(!s.alive)return;
      ctx.save();
      ctx.translate(s.x,s.y);
      ctx.rotate(degToRad(s.angle));
      if(s.invulnerable>0&&s.blink)ctx.globalAlpha=0.25;
      ctx.beginPath();
      ctx.moveTo(s.r,0);
      ctx.lineTo(-s.r,-s.r*0.7);
      ctx.lineTo(-s.r,s.r*0.7);
      ctx.closePath();
      ctx.strokeStyle=s.color;
      ctx.lineWidth=2;
      ctx.stroke();
      if(s.thrusting){
        ctx.beginPath();
        ctx.moveTo(-s.r,0);
        ctx.lineTo(-s.r-rand(8,14),rand(-8,8));
        ctx.strokeStyle="#ffcc66";
        ctx.lineWidth=2;
        ctx.stroke();
      }
      ctx.restore();
      ctx.globalAlpha=1;
    }

    function drawAsteroid(a){
      var pts=a.points,k;
      ctx.save();
      ctx.translate(a.x,a.y);
      ctx.beginPath();
      ctx.moveTo(pts[0].x,pts[0].y);
      for(k=1;k<pts.length;k++)ctx.lineTo(pts[k].x,pts[k].y);
      ctx.closePath();
      ctx.strokeStyle="#999";
      ctx.lineWidth=2;
      ctx.stroke();
      ctx.restore();
    }

    function drawUFO(u){
      ctx.save();
      ctx.translate(u.x,u.y);
      ctx.strokeStyle=u.large?"#c6f":"#f9c";
      ctx.lineWidth=2;
      ctx.beginPath();
      if(u.large){
        ctx.ellipse(0,0,u.r,u.r*0.35,0,0,Math.PI*2);
        ctx.moveTo(-u.r*0.5,-8);ctx.lineTo(u.r*0.5,-8);
      }else{
        ctx.ellipse(0,0,u.r,u.r*0.4,0,0,Math.PI*2);
      }
      ctx.stroke();
      ctx.restore();
    }

    function draw(){
      var i,lx,sy;
      ctx.fillStyle="#000";
      ctx.fillRect(0,0,W,H);
      for(i=0;i<asteroids.length;i++)drawAsteroid(asteroids[i]);
      for(i=0;i<ufos.length;i++)drawUFO(ufos[i]);
      ctx.fillStyle="#f88";
      for(i=0;i<ufoBullets.length;i++){
        ctx.beginPath();
        ctx.arc(ufoBullets[i].x,ufoBullets[i].y,2.5,0,Math.PI*2);
        ctx.fill();
      }
      ctx.fillStyle="#aaffff";
      for(i=0;i<bullets.length;i++){
        ctx.beginPath();
        ctx.arc(bullets[i].x,bullets[i].y,2,0,Math.PI*2);
        ctx.fill();
      }
      for(i=0;i<particles.length;i++){
        ctx.fillStyle=particles[i].color;
        ctx.globalAlpha=Math.max(0,particles[i].life/PARTICLE_LIFE);
        ctx.fillRect(particles[i].x,particles[i].y,2,2);
      }
      ctx.globalAlpha=1;
      for(i=0;i<ships.length;i++)drawShip(ships[i]);
      var lifeCount=gameMode===3?playerLives[0]+playerLives[1]:lives;
      for(i=0;i<lifeCount;i++){
        lx=8+i*28;sy=8;
        ctx.save();
        ctx.translate(lx,sy);
        ctx.beginPath();
        ctx.moveTo(8,0);ctx.lineTo(-8,-6);ctx.lineTo(-8,6);
        ctx.closePath();
        ctx.strokeStyle="#fff";
        ctx.lineWidth=2;
        ctx.stroke();
        ctx.restore();
      }
    }

    function loop(ts){
      if(!window.__asteroidsOn)return;
      if(!lastTime)lastTime=ts;
      var dt=Math.min(0.05,(ts-lastTime)/1000);
      lastTime=ts;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    function onKeyDown(e){
      var k=e.key.toLowerCase();
      keys[k]=true;
      if(e.key===" ")keys.space=true;
      if(e.key==="ArrowUp")keys.arrowup=true;
      if(e.key==="ArrowDown")keys.arrowdown=true;
      if(e.key==="ArrowLeft")keys.arrowleft=true;
      if(e.key==="ArrowRight")keys.arrowright=true;
      if(k==="p")togglePause();
      if(k==="r")respawn();
      if([" ","arrowup","arrowdown","arrowleft","arrowright","w","a","s","d"].indexOf(k)>=0||
         ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].indexOf(e.key)>=0)e.preventDefault();
    }
    function onKeyUp(e){
      var k=e.key.toLowerCase();
      keys[k]=false;
      if(e.key===" ")keys.space=false;
      if(e.key==="ArrowUp")keys.arrowup=false;
      if(e.key==="ArrowDown")keys.arrowdown=false;
      if(e.key==="ArrowLeft")keys.arrowleft=false;
      if(e.key==="ArrowRight")keys.arrowright=false;
    }

    astStartBtn.addEventListener("click",startGame);
    restartBtn.addEventListener("click",startGame);
    document.addEventListener("keydown",onKeyDown,true);
    document.addEventListener("keyup",onKeyUp,true);

    ships=[createShip()];
    asteroids=[];bullets=[];particles=[];ufos=[];ufoBullets=[];
    spawnAsteroids(3);
    draw();
    requestAnimationFrame(loop);

    window.__asteroidsOff=function(){
      window.__asteroidsOn=false;
      playing=false;running=false;
      document.removeEventListener("keydown",onKeyDown,true);
      document.removeEventListener("keyup",onKeyUp,true);
      root.remove();
      delete window.__asteroidsOn;
      delete window.__asteroidsOff;
    };
  }

  runAsteroids();
})();
</script>
</body>
</html>

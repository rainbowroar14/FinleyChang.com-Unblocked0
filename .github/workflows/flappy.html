<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inspect Flappy</title>
</head>
<body id="flappyStandalone">
<script>
(function(){
  var standalone = document.body.id === "flappyStandalone";

  function runFlappy(){
    if(window.__flappyOn)return;
    if(window.__flappyOff)window.__flappyOff();
    window.__flappyOn=true;

    var root=document.createElement("div");
    root.id="__flappyRoot";
    root.style.cssText=standalone
      ?"margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a2a32;font-family:Arial,Helvetica,sans-serif;color:#fff;padding:16px;box-sizing:border-box;"
      :"position:fixed;inset:0;z-index:2147483640;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:auto;padding:16px;box-sizing:border-box;background:#1a2a32;font-family:Arial,Helvetica,sans-serif;color:#fff;";

    root.innerHTML=
      '<div id="__flappyMenu" style="text-align:center;max-width:340px;">'+
      '<h2 style="margin:0 0 14px;font-size:1.35em;">Inspect Flappy</h2>'+
      '<p style="margin:0 0 8px;font-size:14px;"><strong>Settings</strong></p>'+
      '<label style="display:block;margin:6px 0;font-size:13px;">Gravity <input type="range" id="__flapGrav" min="25" max="70" value="50"><span id="__flapGravV">0.50</span></label>'+
      '<label style="display:block;margin:6px 0;font-size:13px;">Flap power <input type="range" id="__flapLift" min="60" max="120" value="80"><span id="__flapLiftV">-8</span></label>'+
      '<label style="display:block;margin:6px 0;font-size:13px;">Pipe speed <input type="range" id="__flapSpd" min="1" max="5" value="2"><span id="__flapSpdV">2</span></label>'+
      '<label style="display:block;margin:6px 0;font-size:13px;">Gap size <input type="range" id="__flapGap" min="80" max="160" value="120"><span id="__flapGapV">120</span></label>'+
      '<label style="display:block;margin:6px 0;font-size:13px;">Pipe spacing <input type="range" id="__flapInt" min="60" max="120" value="90"><span id="__flapIntV">90</span></label>'+
      '<button type="button" id="__flappyStart" style="margin-top:12px;padding:10px 24px;cursor:pointer;font-family:inherit;">Start game</button>'+
      (standalone?'<p style="margin-top:14px;font-size:0.9em;"><a href="index.html" style="color:#9df;">Terrible settings</a></p>':'')+
      '</div>'+
      '<div id="__flappyGame" style="display:none;text-align:center;">'+
      '<canvas id="flappyCanvas" width="400" height="500" style="border:4px solid #fff;border-radius:10px;display:block;max-width:100%;"></canvas>'+
      '<div style="margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">'+
      '<button type="button" id="__flappyRestart" style="padding:8px 16px;cursor:pointer;font-family:inherit;">Restart</button>'+
      '<button type="button" id="__flappyMenuBtn" style="padding:8px 16px;cursor:pointer;font-family:inherit;">Menu (Esc)</button>'+
      '</div>'+
      '<p id="__flappyHint" style="margin:8px 0 0;font-size:13px;color:#ccc;">Space or click to flap</p>'+
      '</div>';

    if(standalone)document.body.innerHTML="";
    (standalone?document.body:document.documentElement).appendChild(root);

    var menu=document.getElementById("__flappyMenu");
    var gameBox=document.getElementById("__flappyGame");
    var canvas=document.getElementById("flappyCanvas");
    var ctx=canvas.getContext("2d");
    var W=canvas.width,H=canvas.height;

    var bird,pipes,frame,score,dead,playing,raf=0;
    var grav=0.5,lift=-8,pipeSpd=2,gapSize=120,pipeInt=90;
    var clouds=[{x:40,y:60,s:1},{x:180,y:90,s:0.7},{x:300,y:45,s:1.1},{x:120,y:140,s:0.85}];

    function bindRange(id,vid,fmt){
      var el=document.getElementById(id),vl=document.getElementById(vid);
      el.addEventListener("input",function(){vl.textContent=fmt(el);});
    }
    bindRange("__flapGrav","__flapGravV",function(e){return(e.value/100).toFixed(2);});
    bindRange("__flapLift","__flapLiftV",function(e){return"-"+Math.round(e.value/10);});
    bindRange("__flapSpd","__flapSpdV",function(e){return e.value;});
    bindRange("__flapGap","__flapGapV",function(e){return e.value;});
    bindRange("__flapInt","__flapIntV",function(e){return e.value;});

    function readSettings(){
      grav=parseInt(document.getElementById("__flapGrav").value,10)/100;
      lift=-parseInt(document.getElementById("__flapLift").value,10)/10;
      pipeSpd=parseInt(document.getElementById("__flapSpd").value,10);
      gapSize=parseInt(document.getElementById("__flapGap").value,10);
      pipeInt=parseInt(document.getElementById("__flapInt").value,10);
    }

    function resetGame(){
      bird={x:70,y:H/2,r:14,dy:0,wing:0};
      pipes=[];
      frame=0;
      score=0;
      dead=false;
    }

    function showMenu(){
      playing=false;
      dead=true;
      if(raf){cancelAnimationFrame(raf);raf=0;}
      menu.style.display="block";
      gameBox.style.display="none";
    }

    function startGame(){
      readSettings();
      resetGame();
      playing=true;
      menu.style.display="none";
      gameBox.style.display="block";
      if(raf)cancelAnimationFrame(raf);
      loop();
    }

    function flap(){
      if(!playing||dead)return;
      bird.dy=lift;
      bird.wing=1;
    }

    function drawBackground(){
      var g=ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,"#4ec0ca");
      g.addColorStop(0.55,"#87ceeb");
      g.addColorStop(0.85,"#bce8f5");
      g.addColorStop(1,"#ded895");
      ctx.fillStyle=g;
      ctx.fillRect(0,0,W,H);

      var i,c,x,y;
      for(i=0;i<clouds.length;i++){
        c=clouds[i];
        x=((c.x-frame*0.3*c.s)% (W+80))-40;
        y=c.y;
        ctx.fillStyle="rgba(255,255,255,0.85)";
        ctx.beginPath();
        ctx.arc(x,y,18*c.s,0,Math.PI*2);
        ctx.arc(x+22*c.s,y+4*c.s,22*c.s,0,Math.PI*2);
        ctx.arc(x+48*c.s,y,16*c.s,0,Math.PI*2);
        ctx.fill();
      }

      ctx.fillStyle="#73bf2e";
      ctx.fillRect(0,H-72,W,72);
      ctx.fillStyle="#5a9e24";
      for(i=0;i<W;i+=14){
        ctx.fillRect(i,H-72,8,10);
      }
      ctx.fillStyle="#c4a035";
      ctx.fillRect(0,H-12,W,12);
    }

    function drawPipe(p){
      var cap=14;
      ctx.fillStyle="#5c4033";
      ctx.fillRect(p.x-3,0,p.w+6,p.top);
      ctx.fillRect(p.x-3,H-p.bottom,p.w+6,p.bottom);
      ctx.fillStyle="#2d8a2d";
      ctx.fillRect(p.x,0,p.w,p.top-cap);
      ctx.fillRect(p.x,H-p.bottom+cap,p.w,p.bottom-cap);
      ctx.fillStyle="#3cb043";
      ctx.fillRect(p.x+4,0,8,p.top-cap);
      ctx.fillRect(p.x+4,H-p.bottom+cap,8,p.bottom-cap);
      ctx.fillStyle="#256b25";
      ctx.fillRect(p.x-2,p.top-cap,p.w+4,cap);
      ctx.fillRect(p.x-2,H-p.bottom,p.w+4,cap);
      ctx.strokeStyle="#1a501a";
      ctx.lineWidth=2;
      ctx.strokeRect(p.x,p.top-cap,p.w,cap);
      ctx.strokeRect(p.x,H-p.bottom,p.w,cap);
    }

    function drawBird(){
      var bx=bird.x,by=bird.y,r=bird.r,wing=bird.wing;
      ctx.save();
      ctx.translate(bx,by);
      ctx.rotate(Math.min(0.6,Math.max(-0.5,bird.dy*0.06)));

      ctx.fillStyle="#f4c430";
      ctx.beginPath();
      ctx.ellipse(0,0,r,r*0.92,0,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle="#d4a017";
      ctx.lineWidth=2;
      ctx.stroke();

      ctx.fillStyle="#e8b020";
      ctx.beginPath();
      ctx.ellipse(-4,wing?-6:-2,r*0.55,r*0.35,-0.4,0,Math.PI*2);
      ctx.fill();

      ctx.fillStyle="#fff";
      ctx.beginPath();
      ctx.arc(r*0.35,-r*0.15,r*0.38,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle="#111";
      ctx.beginPath();
      ctx.arc(r*0.45,-r*0.12,r*0.16,0,Math.PI*2);
      ctx.fill();

      ctx.fillStyle="#e67e22";
      ctx.beginPath();
      ctx.moveTo(r*0.7,0);
      ctx.lineTo(r*1.35,r*0.12);
      ctx.lineTo(r*0.7,r*0.22);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
      if(bird.wing>0)bird.wing-=0.15;
    }

    function drawScore(){
      ctx.font="bold 28px Arial";
      ctx.strokeStyle="#000";
      ctx.lineWidth=4;
      ctx.strokeText(String(score),W/2-8,48);
      ctx.fillStyle="#fff";
      ctx.fillText(String(score),W/2-8,48);
    }

    function drawGameOver(){
      ctx.fillStyle="rgba(0,0,0,0.55)";
      ctx.fillRect(0,0,W,H);
      ctx.font="bold 32px Arial";
      ctx.fillStyle="#fff";
      ctx.textAlign="center";
      ctx.fillText("GAME OVER",W/2,H/2-20);
      ctx.font="20px Arial";
      ctx.fillText("Score: "+score,W/2,H/2+20);
      ctx.font="14px Arial";
      ctx.fillText("Restart or Menu",W/2,H/2+50);
      ctx.textAlign="left";
    }

    function update(){
      var i,p;
      bird.dy+=grav;
      bird.y+=bird.dy;
      if(bird.y-bird.r<0){bird.y=bird.r;bird.dy=0;}
      if(bird.y+bird.r>=H-12){dead=true;playing=false;}

      if(frame%pipeInt===0){
        var top=Math.random()*(H-gapSize-100)+40;
        pipes.push({x:W,w:52,top:top,bottom:H-top-gapSize,passed:false});
      }

      for(i=0;i<pipes.length;i++){
        pipes[i].x-=pipeSpd;
        p=pipes[i];
        if(!dead&&bird.x+bird.r>p.x&&bird.x-bird.r<p.x+p.w){
          if(bird.y-bird.r<p.top||bird.y+bird.r>H-p.bottom){
            dead=true;playing=false;
          }
        }
        if(!p.passed&&p.x+p.w<bird.x){score++;p.passed=true;}
      }
      pipes=pipes.filter(function(p){return p.x+p.w>0;});
      frame++;
    }

    function draw(){
      var i;
      drawBackground();
      for(i=0;i<pipes.length;i++)drawPipe(pipes[i]);
      drawBird();
      drawScore();
      if(dead&&!playing)drawGameOver();
    }

    function loop(){
      if(!window.__flappyOn)return;
      if(playing&&!dead)update();
      draw();
      raf=requestAnimationFrame(loop);
    }

    function onKey(e){
      if(e.code==="Space"||e.key===" "){
        if(playing&&!dead)flap();
        e.preventDefault();
      }
      if(e.key==="Escape"&&gameBox.style.display!=="none"){showMenu();e.preventDefault();}
    }

    canvas.addEventListener("mousedown",flap);
    document.getElementById("__flappyStart").addEventListener("click",startGame);
    document.getElementById("__flappyRestart").addEventListener("click",function(){
      readSettings();resetGame();playing=true;
    });
    document.getElementById("__flappyMenuBtn").addEventListener("click",showMenu);
    document.addEventListener("keydown",onKey,true);

    window.__flappyOff=function(){
      window.__flappyOn=false;
      playing=false;
      if(raf)cancelAnimationFrame(raf);
      document.removeEventListener("keydown",onKey,true);
      root.remove();
      delete window.__flappyOn;
      delete window.__flappyOff;
    };
  }

  runFlappy();
})();
</script>
</body>
</html>

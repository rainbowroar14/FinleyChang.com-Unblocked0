<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inspect Sandbox</title>
</head>
<body id="sandboxStandalone">
<script>
(function(){
  var standalone = document.body.id === "sandboxStandalone";

  function runSandbox(){
    if(window.__sandboxOn)return;
    if(window.__sandboxOff)window.__sandboxOff();
    window.__sandboxOn=true;

    var root=document.createElement("div");
    root.id="__sandboxRoot";
    root.style.cssText=standalone
      ?"margin:0;width:100%;min-height:100vh;display:flex;background:#111;overflow:hidden;"
      :"position:fixed;inset:0;z-index:2147483640;display:flex;background:#111;overflow:hidden;";

    if(standalone)document.body.innerHTML="";
    (standalone?document.body:document.documentElement).appendChild(root);

    var canvas=document.createElement("canvas");
    canvas.id="__sandboxCanvas";
    canvas.style.cssText="flex:1;display:block;cursor:crosshair;touch-action:none;";
    root.appendChild(canvas);

    var panel=document.createElement("div");
    panel.id="__sandboxPanel";
    panel.style.cssText="width:240px;flex-shrink:0;background:#1e1e1e;color:#eee;padding:10px;box-sizing:border-box;overflow-y:auto;font:12px Arial,sans-serif;border-left:2px solid #333;";
    panel.innerHTML='<h2 style="margin:0 0 8px;font-size:15px;">Mini Sandbox</h2>'+
      '<p style="margin:0 0 8px;color:#aaa;font-size:11px;">Space pause · Heavier sinks through lighter fluids</p>'+
      '<div id="__sandboxBtns" style="display:flex;flex-wrap:wrap;gap:4px;"></div>'+
      '<button type="button" id="__sandboxClear" style="width:100%;margin-top:10px;padding:8px;cursor:pointer;">Clear all</button>'+
      (standalone?'<p style="margin-top:10px;"><a href="index.html" style="color:#8cf;">Terrible settings</a></p>':'');
    root.appendChild(panel);

    var ctx=canvas.getContext("2d");
    var GRID=10,AIR_TEMP=30,AIR_DIFF=0.005,EXCHANGE=0.05,CONDUCT=0.5;
    var COLS,ROWS,grid=[],paused=false,frameOff=0;
    var currentTool="sand",mouseX=0,mouseY=0,mouseDown=false,clearConfirm=false;
    var hud=document.createElement("div");
    hud.style.cssText="position:absolute;left:8px;top:8px;padding:6px 10px;background:rgba(0,0,0,0.55);color:#fff;font:13px monospace;pointer-events:none;border-radius:4px;";
    hud.textContent="—";
    root.style.position=standalone?"relative":"fixed";
    root.appendChild(hud);

    function clamp(v,a,b){return v<a?a:v>b?b:v;}
    function mk(type,temp){var e=ELEMENTS[type];return{type:type,temp:temp!=null?temp:e.initialTemp,timer:0};}
    function def(c){return c?ELEMENTS[c.type]:null;}
    function rho(c){return c?def(c).density:0;}
    function isImmobile(type){var d=ELEMENTS[type];return d&&(d.immobile||d.density>=100);}
    function isRigid(type){return!!ELEMENTS[type].rigid;}
    function canSwap(a,b){
      if(!a||!b)return true;
      if(isImmobile(a.type)||isImmobile(b.type))return false;
      if(isRigid(a.type)&&isRigid(b.type))return false;
      return true;
    }
    function canSink(self,target){
      if(!target)return true;
      if(!canSwap(self,target))return false;
      return rho(target)<rho(self);
    }
    function canRise(self,target){
      if(!target)return true;
      if(!canSwap(self,target))return false;
      return rho(target)>rho(self);
    }
    function swap(g,x1,y1,x2,y2){
      var a=g[y1][x1],b=g[y2][x2];
      g[y2][x2]=a;g[y1][x1]=b;
    }

    function mixNeighbors(x,y,g){
      var self=g[y][x];
      if(!self)return;
      var st=self.type,i,xx,yy,n,nt;
      for(i=0;i<4;i++){
        xx=x+(i===0?-1:i===1?1:0);
        yy=y+(i===2?-1:i===3?1:0);
        if(xx<0||xx>=COLS||yy<0||yy>=ROWS)continue;
        n=g[yy][xx];
        if(!n)continue;
        nt=n.type;
        if(st==="water"&&nt==="salt"){g[y][x]=mk("saltwater");g[yy][xx]=null;continue;}
        if(st==="salt"&&nt==="water"){g[yy][xx]=mk("saltwater");g[y][x]=null;continue;}
        if((st==="water"&&nt==="saltwater")||(st==="saltwater"&&nt==="water")){
          if(Math.random()<0.35){g[y][x]=mk("saltwater",(self.temp+n.temp)/2);g[yy][xx]=mk("saltwater",g[y][x].temp);}
          continue;
        }
        if((st==="water"&&nt==="lava")||(st==="lava"&&nt==="water")){
          if(Math.random()<0.4){
            g[y][x]=mk("steam",100);
            g[yy][xx]=mk("basalt",120);
          }
          continue;
        }
        if((st==="water"&&nt==="oil")||(st==="oil"&&nt==="water")){
          if(Math.random()<0.18){
            var avg=(self.temp+n.temp)/2;
            self.temp=avg;n.temp=avg;
          }
          continue;
        }
        if((st==="water"&&nt==="acid")||(st==="acid"&&nt==="water")){
          if(Math.random()<0.12){g[y][x]=mk("water",(self.temp+n.temp)/2);if(Math.random()<0.5)g[yy][xx]=mk("water",g[y][x].temp);}
          continue;
        }
        if((st==="water"&&nt==="toxin")||(st==="toxin"&&nt==="water")){
          if(Math.random()<0.15){
            var t=(self.temp+n.temp)/2;
            if(st==="water")g[y][x]=mk("toxin",t);else g[yy][xx]=mk("toxin",t);
          }
          continue;
        }
        if((st==="oil"&&nt==="fire")||(st==="fire"&&nt==="oil")){
          if(Math.random()<0.2)g[yy][xx]=mk("fire",250);
          if(Math.random()<0.2)g[y][x]=mk("fire",250);
        }
      }
    }

    function powderMove(x,y,g){
      var self=g[y][x],d=def(self);
      if(!d||d.liquid||d.gas||d.immobile||d.rigid)return false;
      if(y+1<ROWS&&canSink(self,g[y+1][x])){swap(g,x,y,x,y+1);return true;}
      var dir=Math.random()<0.5?-1:1;
      for(var t=0;t<2;t++){
        var dx=t===0?dir:-dir,nx=x+dx;
        if(nx<0||nx>=COLS)continue;
        if(y+1<ROWS&&!g[y][nx]&&canSink(self,g[y+1][nx])){swap(g,x,y,nx,y+1);return true;}
        if(!g[y][nx]&&y+1<ROWS&&canSink(self,g[y+1][nx])){swap(g,x,y,nx,y);return true;}
      }
      return false;
    }

    function liquidMove(x,y,g){
      var self=g[y][x];
      if(!def(self).liquid)return;
      if(y+1<ROWS&&canSink(self,g[y+1][x])){swap(g,x,y,x,y+1);mixNeighbors(x,y+1,g);return;}
      var dir=Math.random()<0.5?-1:1;
      for(var t=0;t<2;t++){
        var dx=t===0?dir:-dir,nx=x+dx;
        if(nx<0||nx>=COLS)continue;
        if(y+1<ROWS&&!g[y][nx]&&canSink(self,g[y+1][nx])){swap(g,x,y,nx,y+1);mixNeighbors(nx,y+1,g);return;}
        if(!g[y][nx]&&canSink(self,g[y][nx])){swap(g,x,y,nx,y);mixNeighbors(nx,y,g);return;}
      }
      mixNeighbors(x,y,g);
    }

    function gasMove(x,y,g){
      var self=g[y][x];
      if(!def(self).gas)return;
      if(y>0&&canRise(self,g[y-1][x])){swap(g,x,y,x,y-1);return;}
      var drift=Math.random()<0.5?-1:1;
      if(Math.random()<0.35){
        var nx=x+drift;
        if(nx>=0&&nx<COLS&&!g[y][nx]){swap(g,x,y,nx,y);return;}
      }
      if(y>0){
        var nx=x+drift;
        if(nx>=0&&nx<COLS&&canRise(self,g[y-1][nx])){swap(g,x,y,nx,y-1);}
      }
    }

    function thermal(x,y,g){
      var self=g[y][x];
      if(!self||self.type==="stone"||self.type==="fire"||self.type==="electric")return;
      var nbs=[[x,y-1],[x,y+1],[x-1,y],[x+1,y]],i,nx,ny,n,d;
      for(i=0;i<4;i++){
        nx=nbs[i][0];ny=nbs[i][1];
        if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&(n=g[ny][nx])){
          d=self.temp-n.temp;
          self.temp-=d*EXCHANGE;
          n.temp+=d*EXCHANGE;
        }
      }
    }

    var ELEMENTS={
      sand:{color:"#d4b25c",initialTemp:AIR_TEMP,density:2,
        update(x,y,g){var s=g[y][x];if(powderMove(x,y,g))return;s=g[y][x];if(s.temp>1600)g[y][x]=mk("glass",1600);}},
      wall:{color:"#666",initialTemp:AIR_TEMP,density:100,immobile:true,update(){}},
      water:{color:"#4aa0ff",initialTemp:AIR_TEMP,density:1,liquid:true,
        update(x,y,g){var s=g[y][x];if(s.temp>100){g[y][x]=mk("steam",100);return;}
          if(s.temp<0){g[y][x]=mk("ice",-10);return;}liquidMove(x,y,g);}},
      ice:{color:"#aee",initialTemp:-200,density:0.9,rigid:true,
        update(x,y,g){if(g[y][x].temp>0)g[y][x]=mk("water",5);}},
      steam:{color:"#dde8f0",initialTemp:100,density:0.1,gas:true,
        update(x,y,g){var s=g[y][x];s.timer++;
          if(s.timer>300||s.temp<90){g[y][x]=mk("water",50);return;}gasMove(x,y,g);}},
      fire:{color:"#ff4500",initialTemp:600,density:0.01,gas:true,
        update(x,y,g){var s=g[y][x];s.temp+=5;s.timer++;
          if(s.timer>5&&Math.random()<0.05)g[y][x]=mk("ash",200);
          else if(Math.random()<0.01)g[y][x]=null;
          else gasMove(x,y,g);
          for(var yy=-1;yy<=1;yy++)for(var xx=-1;xx<=1;xx++){
            var nx=x+xx,ny=y+yy;
            if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&g[ny][nx])g[ny][nx].temp+=3;
          }}},
      lava:{color:"#ff6600",initialTemp:800,density:1.5,liquid:true,
        update(x,y,g){liquidMove(x,y,g);if(g[y][x]&&g[y][x].temp<200)g[y][x]=mk("basalt",100);}},
      basalt:{color:"#333",initialTemp:AIR_TEMP,density:5,rigid:true,
        update(x,y,g){if(g[y][x].temp>500)g[y][x]=mk("lava",600);}},
      oil:{color:"#442200",initialTemp:AIR_TEMP,density:0.8,liquid:true,
        update(x,y,g){liquidMove(x,y,g);if(g[y][x]&&g[y][x].temp>150)g[y][x]=mk("fire",200);}},
      plant:{color:"#228b22",initialTemp:AIR_TEMP,density:2,rigid:true,
        update(x,y,g){var s=g[y][x];
          if(s.temp>100)g[y][x]=mk("fire",200);
          if(Math.random()<0.01){var nx=x+(Math.random()<0.5?-1:1);
            if(nx>=0&&nx<COLS&&!g[y][nx])g[y][nx]=mk("plant",20);}}},
      stone:{color:"#555",initialTemp:AIR_TEMP,density:3,rigid:true,
        update(x,y,g){var s=g[y][x];
          for(var yy=-1;yy<=1;yy++)for(var xx=-1;xx<=1;xx++){
            var nx=x+xx,ny=y+yy;
            if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&g[ny][nx])
              g[ny][nx].temp+=(s.temp-g[ny][nx].temp)*0.05;
          }
          if(s.temp>2500)g[y][x]=mk("lava",2000);}},
      snow:{color:"#fff",initialTemp:-50,density:0.5,
        update(x,y,g){if(powderMove(x,y,g))return;if(g[y][x].temp>0)g[y][x]=mk("water",10);}},
      glass:{color:"#aaa095",initialTemp:AIR_TEMP,density:4,rigid:true,
        update(x,y,g){if(g[y][x].temp>2000)g[y][x]=mk("lava",1500);}},
      ash:{color:"#555",initialTemp:AIR_TEMP,density:0.6,
        update(x,y,g){if(powderMove(x,y,g))return;if(g[y][x].temp>400)g[y][x]=mk("fire",450);}},
      electric:{color:"#ffff33",initialTemp:AIR_TEMP,density:0,gas:true,
        update(x,y,g){var s=g[y][x];s.timer++;
          if(s.timer>2){
            var rep=false,yy,xx,nx,ny,n;
            for(yy=-1;yy<=1;yy++)for(xx=-1;xx<=1;xx++){
              nx=x+xx;ny=y+yy;
              if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&(n=g[ny][nx])){
                if(n.type==="copper"||n.type==="wire"||n.type==="heated_copper"||n.type==="saltwater"){
                  g[y][x]=mk(n.type,n.temp);rep=true;break;
                }
              }
            }
            if(!rep)g[y][x]=null;
            return;
          }
          for(yy=-1;yy<=1;yy++)for(xx=-1;xx<=1;xx++){
            nx=x+xx;ny=y+yy;
            if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&(n=g[ny][nx])){
              n.temp+=10;
              if((n.type==="copper"||n.type==="wire"||n.type==="heated_copper"||n.type==="saltwater")&&Math.random()<CONDUCT)
                g[ny][nx]=mk("electric",n.temp);
            }
          }}},
      acid:{color:"#00cc00",initialTemp:AIR_TEMP,density:1.2,liquid:true,
        update(x,y,g){liquidMove(x,y,g);var s=g[y][x];if(!s)return;
          for(var yy=-1;yy<=1;yy++)for(var xx=-1;xx<=1;xx++){
            var nx=x+xx,ny=y+yy,n;
            if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&(n=g[ny][nx])&&n.type!=="acid"&&n.type!=="wall"){
              if(Math.random()<0.1)g[ny][nx]=null;
            }
          }
          if(Math.random()<0.005)g[y][x]=null;}},
      heater:{color:"#ff8800",initialTemp:2000,density:100,immobile:true,
        update(x,y,g){for(var yy=-1;yy<=1;yy++)for(var xx=-1;xx<=1;xx++){
          var nx=x+xx,ny=y+yy;
          if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&g[ny][nx]&&g[ny][nx].type!=="heater")g[ny][nx].temp+=50;
        }}},
      cooler:{color:"#0088ff",initialTemp:-200,density:100,immobile:true,
        update(x,y,g){for(var yy=-1;yy<=1;yy++)for(var xx=-1;xx<=1;xx++){
          var nx=x+xx,ny=y+yy;
          if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&g[ny][nx]&&g[ny][nx].type!=="cooler")g[ny][nx].temp-=50;
        }}},
      wood:{color:"#8b4513",initialTemp:AIR_TEMP,density:3,rigid:true,
        update(x,y,g){if(g[y][x].temp>150)g[y][x]=mk("fire",300);}},
      copper:{color:"#b87333",initialTemp:AIR_TEMP,density:8,rigid:true,
        update(x,y,g){var s=g[y][x];
          if(s.temp>1085)g[y][x]=mk("lava",1000);
          else if(s.temp>400)g[y][x]=mk("heated_copper",s.temp);}},
      wire:{color:"#444",initialTemp:AIR_TEMP,density:8,rigid:true,
        update(x,y,g){if(g[y][x].temp>500)g[y][x]=mk("basalt",400);}},
      battery:{color:"#080",initialTemp:AIR_TEMP,density:10,rigid:true,
        update(x,y,g){for(var yy=-1;yy<=1;yy++)for(var xx=-1;xx<=1;xx++){
          var nx=x+xx,ny=y+yy,n;
          if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&(n=g[ny][nx])){
            if(n.type==="copper"||n.type==="wire"||n.type==="heated_copper"||n.type==="saltwater")
              g[ny][nx]=mk("electric",n.temp);
          }
        }}},
      toxin:{color:"#609",initialTemp:AIR_TEMP,density:0.9,liquid:true,
        update(x,y,g){liquidMove(x,y,g);
          for(var yy=-1;yy<=1;yy++)for(var xx=-1;xx<=1;xx++){
            var nx=x+xx,ny=y+yy,n;
            if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&(n=g[ny][nx])){
              if((n.type==="plant"||n.type==="wood"||n.type==="sand")&&Math.random()<0.05)g[ny][nx]=null;
            }
          }}},
      heated_copper:{color:"#f96",initialTemp:400,density:8,rigid:true,
        update(x,y,g){var s=g[y][x];
          for(var yy=-1;yy<=1;yy++)for(var xx=-1;xx<=1;xx++){
            var nx=x+xx,ny=y+yy;
            if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&g[ny][nx])g[ny][nx].temp+=10;
          }
          if(s.temp<300)g[y][x]=mk("copper",s.temp);
          if(s.temp>1085)g[y][x]=mk("lava",1000);}},
      explosives:{color:"#f00",initialTemp:AIR_TEMP,density:2.1,
        update(x,y,g){if(powderMove(x,y,g))return;var s=g[y][x];
          if(s.temp>100){
            for(var yy=-3;yy<=3;yy++)for(var xx=-3;xx<=3;xx++){
              var nx=x+xx,ny=y+yy;
              if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS){
                if(!g[ny][nx]&&Math.random()<0.5)g[ny][nx]=mk("fire",500);
                if(g[ny][nx])g[ny][nx].temp+=100;
              }
            }
            g[y][x]=null;
          }}},
      salt:{color:"#eee",initialTemp:AIR_TEMP,density:2.2,
        update(x,y,g){powderMove(x,y,g);}},
      saltwater:{color:"#77b0ff",initialTemp:AIR_TEMP,density:1.1,liquid:true,
        update(x,y,g){var s=g[y][x];
          if(s.temp>150){g[y][x]=mk("steam",100);return;}
          liquidMove(x,y,g);}}
    };

    var ALL_TOOLS=["sand","wall","water","oil","lava","basalt","ice","steam","fire","plant","stone","snow","glass","ash","wood","copper","wire","battery","toxin","heated_copper","explosives","salt","saltwater","electric","acid","heater","cooler","heat","cool","erase"];
    var btnWrap=document.getElementById("__sandboxBtns");
    var btns={};

    function setTool(name){
      currentTool=name;
      var k;
      for(k in btns){
        btns[k].style.outline=(k===name)?"2px solid #6cf":"none";
        btns[k].style.background=(k===name)?"#333":"#2a2a2a";
      }
    }

    ALL_TOOLS.forEach(function(name){
      if(!ELEMENTS[name]&&name!=="heat"&&name!=="cool"&&name!=="erase")return;
      var btn=document.createElement("button");
      btn.textContent=name.charAt(0).toUpperCase()+name.slice(1).replace("_"," ");
      btn.style.cssText="width:calc(50% - 4px);margin:0;padding:6px 4px;cursor:pointer;background:#2a2a2a;color:#eee;border:1px solid #444;font-size:11px;";
      btn.onclick=function(){setTool(name);};
      btnWrap.appendChild(btn);
      btns[name]=btn;
    });
    setTool("sand");

    document.getElementById("__sandboxClear").onclick=function(){
      if(!clearConfirm){
        clearConfirm=true;
        this.textContent="Click again to confirm";
        var el=this;
        setTimeout(function(){el.textContent="Clear all";clearConfirm=false;},2000);
      }else{
        grid=Array.from({length:ROWS},function(){return Array(COLS).fill(null);});
        clearConfirm=false;
        this.textContent="Clear all";
      }
    };

    function resize(){
      var pw=standalone?window.innerWidth:root.clientWidth||window.innerWidth;
      var ph=standalone?window.innerHeight:root.clientHeight||window.innerHeight;
      canvas.width=Math.max(200,pw-240);
      canvas.height=Math.max(200,ph);
      COLS=Math.floor(canvas.width/GRID);
      ROWS=Math.floor(canvas.height/GRID);
      var old=grid,nx,ny;
      grid=Array.from({length:ROWS},function(y){
        return Array.from({length:COLS},function(x){
          var c=old[y]&&old[y][x];
          if(c)c.timer=0;
          return c||null;
        });
      });
    }
    window.addEventListener("resize",resize);
    resize();

    function place(x,y){
      if(x<0||x>=COLS||y<0||y>=ROWS)return;
      var brush=(currentTool==="heat"||currentTool==="cool")?1:2;
      var dT=currentTool==="heat"?25:-25;
      for(var dy=-brush;dy<=brush;dy++)for(var dx=-brush;dx<=brush;dx++){
        var px=x+dx,py=y+dy;
        if(px<0||px>=COLS||py<0||py>=ROWS)continue;
        var cell=grid[py][px];
        if(currentTool==="erase")grid[py][px]=null;
        else if(currentTool==="heat"||currentTool==="cool"){if(cell)cell.temp+=dT;}
        else if(ELEMENTS[currentTool]&&cell===null)
          grid[py][px]=mk(currentTool);
      }
    }

    function cellColor(cell){
      var e=ELEMENTS[cell.type],t=cell.temp,base=e.color;
      if(t>200){var r=Math.min(255,parseInt(base.slice(1,3),16)+40);
        return "rgb("+r+","+parseInt(base.slice(3,5),16)+","+parseInt(base.slice(5,7),16)+")";}
      if(t<0)return "#b8d8ff";
      return base;
    }

    canvas.addEventListener("mousedown",function(){mouseDown=true;});
    canvas.addEventListener("mouseup",function(){mouseDown=false;});
    canvas.addEventListener("mouseleave",function(){mouseDown=false;});
    canvas.addEventListener("mousemove",function(e){
      var r=canvas.getBoundingClientRect();
      mouseX=Math.floor((e.clientX-r.left)/GRID);
      mouseY=Math.floor((e.clientY-r.top)/GRID);
      if(mouseDown)place(mouseX,mouseY);
      var cell=grid[mouseY]&&grid[mouseY][mouseX];
      hud.textContent=cell?cell.type+" | "+Math.round(cell.temp)+"°C | "+(paused?"PAUSED":"RUN"):"— | "+(paused?"PAUSED":"RUN");
    });

    function onKey(e){
      if(e.code==="Space"){paused=!paused;e.preventDefault();}
    }

    function tickCells(off){
      var y,x,cell;
      for(y=ROWS-1;y>=0;y--)for(x=off;x<COLS;x+=2){
        cell=grid[y][x];
        if(!cell)continue;
        if(ELEMENTS[cell.type])ELEMENTS[cell.type].update(x,y,grid);
        thermal(x,y,grid);
        cell.temp+=(AIR_TEMP-cell.temp)*AIR_DIFF;
        cell.temp=clamp(cell.temp,-200,5000);
      }
    }

    function update(){
      if(paused)return;
      frameOff=1-frameOff;
      tickCells(frameOff);
      tickCells(1-frameOff);
    }

    function draw(){
      var y,x,cell;
      ctx.fillStyle="#0a0a12";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      for(y=0;y<ROWS;y++)for(x=0;x<COLS;x++){
        cell=grid[y][x];
        if(cell){
          ctx.fillStyle=cellColor(cell);
          ctx.fillRect(x*GRID,y*GRID,GRID,GRID);
        }
      }
      ctx.strokeStyle="rgba(255,255,255,0.35)";
      ctx.lineWidth=1;
      ctx.strokeRect(mouseX*GRID,mouseY*GRID,GRID,GRID);
    }

    var raf=0;
    function loop(){
      if(!window.__sandboxOn)return;
      update();
      draw();
      raf=requestAnimationFrame(loop);
    }

    document.addEventListener("keydown",onKey,true);
    loop();

    window.__sandboxOff=function(){
      window.__sandboxOn=false;
      if(raf)cancelAnimationFrame(raf);
      window.removeEventListener("resize",resize);
      document.removeEventListener("keydown",onKey,true);
      root.remove();
      delete window.__sandboxOn;
      delete window.__sandboxOff;
    };
  }

  runSandbox();
})();
</script>
</body>
</html>
